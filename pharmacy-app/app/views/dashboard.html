<div class="py-3">
  <h1 class="h3 mb-4">{{ vm.title }}</h1>

  <system-alert message="{{ vm.error }}" type="error"></system-alert>
  <system-alert ng-if="vm.loading" message="Loading..." type="info"></system-alert>

  <div ng-if="vm.overview && !vm.loading" class="row g-3">
    <div class="col-sm-6 col-md-3">
      <dashboard-card title="Total Medicines" value="vm.overview.totalMedicines"></dashboard-card>
    </div>
    <div class="col-sm-6 col-md-3">
      <dashboard-card title="Total Customers" value="vm.overview.totalCustomers"></dashboard-card>
    </div>
    <div class="col-sm-6 col-md-3">
      <dashboard-card title="Total Invoices" value="vm.overview.totalInvoices"></dashboard-card>
    </div>
    <div class="col-sm-6 col-md-3">
      <dashboard-card title="Low Stock Medicines" value="vm.overview.lowStockCount"></dashboard-card>
    </div>
  </div>
</div>
