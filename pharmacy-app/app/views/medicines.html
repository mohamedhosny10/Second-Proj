<div class="py-3">
  <h1 class="h3 mb-3 d-flex justify-content-between align-items-center">
    <span>{{ vm.title }}</span>
    <button
      class="btn btn-sm btn-outline-secondary"
      type="button"
      ng-click="vm.startCreate()"
    >
      New medicine
    </button>
  </h1>

  <div class="row mb-3">
    <div class="col-md-4 mb-2">
      <input
        type="text"
        class="form-control"
        placeholder="Search by name"
        ng-model="vm.search"
        ng-change="vm.onSearchChange()"
      >
    </div>
  </div>

  <div ng-if="vm.error" class="alert alert-danger">
    {{ vm.error }}
  </div>

  <div ng-if="vm.loading" class="alert alert-info">
    Loading medicines...
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h2 class="h5 mb-3">{{ vm.editing ? 'Edit medicine' : 'Create medicine' }}</h2>
      <form ng-submit="vm.save()" novalidate>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" ng-model="vm.form.name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Category</label>
            <input type="text" class="form-control" ng-model="vm.form.category">
          </div>
          <div class="col-md-4">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" class="form-control" ng-model="vm.form.price" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Stock quantity</label>
            <input type="number" class="form-control" ng-model="vm.form.stock_quantity" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Expiry date</label>
            <input type="date" class="form-control" ng-model="vm.form.expiry_date">
          </div>
        </div>
        <div class="mt-3">
          <button
            type="submit"
            class="btn btn-primary"
            ng-disabled="vm.loading"
          >
            <span ng-if="!vm.loading">Save</span>
            <span ng-if="vm.loading">Saving...</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h2 class="h5 mb-3">Medicines</h2>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Expiry</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="m in vm.items">
              <td>{{ m.name }}</td>
              <td>{{ m.category }}</td>
              <td>{{ m.price | currency }}</td>
              <td ng-class="{'text-danger': m.stock_quantity <= 0}">
                {{ m.stock_quantity }}
              </td>
              <td>{{ m.expiry_date | date:'yyyy-MM-dd' }}</td>
              <td class="text-end">
                <button
                  class="btn btn-sm btn-outline-primary me-1"
                  type="button"
                  ng-click="vm.startEdit(m)"
                >
                  Edit
                </button>
                <button
                  class="btn btn-sm btn-outline-danger"
                  type="button"
                  ng-click="vm.remove(m)"
                  ng-disabled="!vm.isAdmin"
                >
                  Delete
                </button>
              </td>
            </tr>
            <tr ng-if="!vm.items.length && !vm.loading">
              <td colspan="6" class="text-center text-muted">
                No medicines found.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
