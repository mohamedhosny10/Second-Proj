<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="alert alert-danger" ng-if="vm.errorMessage">
        {{ vm.errorMessage }}
      </div>

      <div class="card shadow-sm">
        <div class="card-header">
          <h5 class="mb-0">
            {{ vm.isEdit ? 'Edit Customer' : 'New Customer' }}
          </h5>
        </div>

        <div class="card-body">
          <form name="customerForm" novalidate ng-submit="vm.save(customerForm)">
            <div class="mb-3">
              <label class="form-label">Customer Name</label>
              <input
                type="text"
                name="full_name"
                class="form-control"
                ng-model="vm.customer.full_name"
                ng-required="true"
                ng-minlength="2"
              >
              <span class="text-danger small d-block" ng-if="customerForm.full_name.$touched && customerForm.full_name.$invalid">
                <span ng-if="customerForm.full_name.$error.required">Name is required.</span>
                <span ng-if="!customerForm.full_name.$error.required && customerForm.full_name.$error.minlength">Name must be at least 2 characters.</span>
              </span>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input
                type="text"
                name="phone"
                class="form-control"
                ng-model="vm.customer.phone"
                ng-pattern="/^[0-9\\-+ ()]*$/"
              >
              <span class="text-danger small d-block" ng-if="customerForm.phone.$touched && customerForm.phone.$invalid">
                Invalid phone format.
              </span>
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" name="address" class="form-control" ng-model="vm.customer.address">
            </div>
            <div class="d-flex justify-content-end">
              <a href="#!/customers" class="btn btn-outline-secondary me-2">Cancel</a>
              <button type="submit" class="btn btn-primary" ng-disabled="customerForm.$invalid">
                Save
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
